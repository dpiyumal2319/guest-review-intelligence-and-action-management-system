name: PR Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guest_reviews
          POSTGRES_PASSWORD: guest_reviews
          POSTGRES_DB: guest_reviews
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://guest_reviews:guest_reviews@localhost:5432/guest_reviews

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run web lint
        run: npm run lint:web

      - name: Run web build
        run: npm run build:web

      - name: Run API migrations
        run: npm run api:migrate

      - name: Seed API reference data
        run: npm run api:seed

      - name: Run API tests
        run: npm run api:test
